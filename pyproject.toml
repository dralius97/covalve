[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "covalve"
version = "0.2.5"
description = "A code-based AI pipeline runtime built on Finite State Machine principles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Candra Julius", email = "candrajulius97@gmail.com" }
]
keywords = ["ai", "pipeline", "fsm", "llm", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/dralius97/covalve"
Issues = "https://github.com/dralius97/covalve/issues"

[tool.hatch.build.targets.wheel]
packages = ["covalve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = [
    "covalve/runtime/",
    "covalve/infrastructure/base/",
    "covalve/infrastructure/contract.py",
]
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
